name: appintegra
description: "AgroTech: app Flutter de monitoramento IoT de cultivo (sensores, bomba de irrigação, clima e chat)."
# Pacote privado: não vai para o pub.dev.
publish_to: 'none'

# versionName+versionCode no Android. Pode ser sobrescrito no build com
# --build-name e --build-number.
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  # Fonte de ícones Cupertino (padrão do template Flutter).
  cupertino_icons: ^1.0.8
  # Chamadas à API dos sensores, ao Langflow e à HG Brasil.
  http: ^0.13.3
  # Ícones do clima em SVG (home_page.dart e weather_detail_page.dart).
  flutter_svg: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints recomendados; ativados em analysis_options.yaml.
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Só o que o código em lib/ referencia. As demais imagens em images/
  # (fases da lua, senai.png, mato.png...) não entram no pacote.
  assets:
    - images/carrossel1.png
    - images/carrossel2.png
    - images/carrossel3.png
    - images/clear_day.svg
    - images/clear_night.svg
    - images/cloudly_day.svg
    - images/cloudly_night.svg
    - images/fog.svg
    - images/rain.svg
    - images/snow.svg
    - images/storm.svg
